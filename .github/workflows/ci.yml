name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc, os: ubuntu-latest, cc: gcc, cxx: g++, flags: "" }
          - { name: linux-clang-sanitizers, os: ubuntu-latest, cc: clang, cxx: clang++, flags: "-DASTERISM_SANITIZERS=ON" }
          - { name: linux-no-threads, os: ubuntu-latest, cc: gcc, cxx: g++, flags: "-DASTERISM_NO_THREADS=ON" }
          - { name: linux-llama, os: ubuntu-latest, cc: gcc, cxx: g++, flags: "-DASTERISM_WITH_LLAMA=ON -DGGML_NATIVE=OFF" }
          - { name: macos-clang, os: macos-latest, cc: clang, cxx: clang++, flags: "" }
          - { name: windows-msvc, os: windows-latest, cc: cl, cxx: cl, flags: "" }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install libcurl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Install SDK check tools
        run: npm ci --prefix sdk --ignore-scripts --no-audit --no-fund
      - name: Configure
        env: { CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}" }
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DASTERISM_WITH_LLAMA=OFF ${{ matrix.flags }}
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: SDK packages
        if: matrix.name == 'linux-gcc'
        run: |
          python -m pip install setuptools==84.0.0
          python sdk/tests/package_smoke.py build/bin/asngn-mcp "$(command -v node)" sdk/node_modules/typescript/bin/tsc
      - name: Keep test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.name }}
          path: build/Testing/Temporary/*.log
          if-no-files-found: ignore

  fuzz:
    name: fuzz-${{ matrix.module }}-${{ matrix.input }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: asmodel, input: json }
          - { module: asmodel, input: provider }
          - { module: astools, input: manifest }
          - { module: astools, input: schema }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - name: Build target
        run: |
          cmake -B build -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DASTERISM_WITH_LLAMA=OFF -DASTERISM_BUILD_TESTS=OFF -DASTERISM_BUILD_FUZZERS=ON
          cmake --build build --target ${{ matrix.module }}-fuzz-${{ matrix.input }} -j 4
      - name: Fuzz
        run: |
          mkdir -p artifacts corpus
          cp modules/${{ matrix.module }}/fuzz/corpus/${{ matrix.input }}/* corpus/
          build/modules/${{ matrix.module }}/${{ matrix.module }}-fuzz-${{ matrix.input }} -seed=1 -max_len=16384 \
            -timeout=5 -max_total_time=30 -rss_limit_mb=512 -print_final_stats=1 -artifact_prefix=artifacts/ corpus
      - name: Keep failing inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.module }}-${{ matrix.input }}
          path: artifacts/
          if-no-files-found: ignore
